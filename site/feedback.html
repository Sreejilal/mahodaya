<style>
  /* Same tokens as index.html and loans.html, so it is one site. */
  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --navy: #0A1628;
    --navy-mid: #112240;
    --white: #FDFCF8;
    --text-muted: #8A9BB0;
    --green: #2ECC71;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans', sans-serif; background:var(--navy); color:var(--white); overflow-x:hidden; min-height:100vh; display:flex; flex-direction:column; }
  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--gold-light); outline-offset:3px; }

  nav { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 40px; border-bottom:1px solid rgba(201,168,76,0.15); }
  .nav-logo { font-family:'Playfair Display', serif; font-size:22px; color:var(--gold); letter-spacing:.5px; text-decoration:none; }
  .nav-logo span { color:var(--white); font-weight:700; }

  main { flex:1; width:100%; max-width:600px; margin:0 auto; padding:clamp(32px, 6vw, 56px) 24px; }
  .langs { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:26px; }
  .lang-pill {
    padding:10px 16px; min-height:44px; border-radius:100px; font-size:13px; font-weight:500;
    border:1px solid rgba(201,168,76,0.25); color:var(--gold-light); background:rgba(201,168,76,0.07);
    cursor:pointer; font-family:'DM Sans', sans-serif;
  }
  .lang-pill.active { background:#16294A; border-color:var(--gold); font-weight:700; }
  h1 { font-family:'Playfair Display', serif; font-size:clamp(30px, 6vw, 42px); line-height:1.2; text-align:center; margin-bottom:12px; overflow-wrap:anywhere; }
  html:not([lang="en"]) h1 { font-size:clamp(25px, 5.4vw, 36px); }   /* wider scripts: one long Malayalam word was wider than a phone */
  .sub { color:var(--text-muted); font-size:15.5px; line-height:1.7; text-align:center; max-width:46ch; margin:0 auto 28px; }

  .form-wrap { background:var(--navy-mid); border:1px solid rgba(201,168,76,0.15); border-radius:20px; padding:32px; }
  .group { display:flex; flex-direction:column; gap:8px; margin-bottom:18px; min-width:0; }
  .group > label, .group > .lbl { font-size:13px; font-weight:500; color:var(--text-muted); }
  input[type=text], input[type=tel], select, textarea {
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:8px;
    padding:12px 16px; min-height:46px; color:var(--white); font-size:14px; font-family:'DM Sans', sans-serif; outline:none; width:100%; min-width:0;
  }
  input:focus, select:focus, textarea:focus { border-color:var(--gold); }
  select option { background:var(--navy-mid); }
  textarea { min-height:110px; resize:vertical; line-height:1.6; }

  /* The stars: the only required part. */
  .stars { display:flex; gap:6px; }
  .star { width:52px; height:52px; border-radius:12px; border:1px solid rgba(201,168,76,0.25); background:rgba(255,255,255,0.03); cursor:pointer; display:grid; place-items:center; transition:transform .15s, background .15s, border-color .15s; }
  .star svg { width:28px; height:28px; fill:none; stroke:var(--gold); stroke-width:1.6; stroke-linejoin:round; }
  .star.on { background:rgba(201,168,76,0.16); border-color:var(--gold); }
  .star.on svg { fill:var(--gold); }
  .star:hover { transform:translateY(-2px); }
  .stars.need .star { border-color:#E0685F; }

  .check { display:flex; align-items:flex-start; gap:10px; margin:4px 0 20px; padding:12px 14px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:8px; }
  .check input { margin-top:3px; width:16px; height:16px; accent-color:var(--gold); flex-shrink:0; cursor:pointer; }
  .check label { font-size:12.5px; color:var(--text-muted); line-height:1.6; cursor:pointer; min-width:0; overflow-wrap:anywhere; }

  .send {
    width:100%; background:linear-gradient(180deg, #F5D97E, #DDB958); color:#1A1204; border:none;
    box-shadow:0 4px 20px rgba(232,201,106,0.3); padding:16px; border-radius:8px; font-weight:700; font-size:16px;
    cursor:pointer; font-family:'DM Sans', sans-serif;
  }
  .send:hover { background:linear-gradient(180deg, #FFE9A0, #EBC96A); }
  .send:disabled { opacity:.6; cursor:wait; }
  .msg { min-height:20px; margin-top:12px; font-size:13px; text-align:center; color:#F3C8C3; }
  .bot { position:absolute; left:-9999px; }

  .sent-ok { text-align:center; padding:28px 8px; }
  .sent-ok svg { width:62px; height:62px; fill:none; stroke:var(--green); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; margin-bottom:18px; }
  .sent-ok circle { stroke-opacity:.35; }
  .sent-ok h2 { font-family:'Playfair Display', serif; font-size:24px; margin-bottom:8px; }
  .sent-ok p { color:var(--text-muted); font-size:15px; line-height:1.7; }

  footer { text-align:center; padding:28px 16px; border-top:1px solid rgba(255,255,255,0.06); color:var(--text-muted); font-size:12px; line-height:1.8; }
  footer a { color:var(--gold-light); }
  footer .snd-btn { background:none; border:0; padding:12px 4px; color:var(--gold-light); font:inherit; text-decoration:underline; cursor:pointer; }

  @media (max-width:600px){
    nav { padding:14px 16px; }
    .nav-logo { font-size:20px; }
    main { padding-left:16px; padding-right:16px; }
    .form-wrap { padding:22px 16px; }
    .star { width:48px; height:48px; }
  }
  @media (max-width:360px){ .star { width:42px; height:42px; } .star svg { width:24px; height:24px; } }
  @media (prefers-reduced-motion: reduce){ .star { transition:none; } .star:hover { transform:none; } }
</style>
<style>

  input:not([type=checkbox]):not([type=radio]):not([type=range]), select, textarea { font-size:16px !important; }

<!-- SOUND (v2026.11.06b): small, quiet sounds, made in the browser (no sound files). A soft tap on the main
     buttons, a chime when a form is sent, a low note when a form has a problem, and a bloom with the intro.
     "Sound: on/off" in the footer turns it off; the choice is kept in this browser only. Browsers allow sound
     only after the visitor's first tap, so the intro plays its sound only where the browser already allows it.
     Same block on index.html, loans.html and feedback.html. -->
<script>
var SND = (function(){
  var KEY = 'mh_sound', on = true, ctx = null;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { on = localStorage.getItem(KEY) !== 'off'; } catch (e) {}
  function ac(){
    if (!ctx) { var A = window.AudioContext || window.webkitAudioContext; if (!A) return null; try { ctx = new A(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') { try { ctx.resume().catch(function(){}); } catch (e) {} }
    return ctx;
  }
  // One soft note: f Hz (sliding to f2), starting t seconds from now, fading out over dur.
  function note(c, f, t, dur, vol, type, f2, att){
    var o = c.createOscillator(), g = c.createGain(), s = c.currentTime + t;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, s);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, s + dur);
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(vol, s + (att || 0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    o.connect(g); g.connect(c.destination);
    o.start(s); o.stop(s + dur + 0.05);
  }
  var SOUNDS = {
    tap: function(c){ note(c, 740, 0, 0.09, 0.06, 'sine', 520); },
    ok:  function(c){ [659.25, 830.61, 987.77].forEach(function(f, i){ note(c, f, i * 0.09, 0.6, 0.05); note(c, f * 2, i * 0.09, 0.3, 0.012); }); },
    err: function(c){ note(c, 311.13, 0, 0.16, 0.05, 'triangle'); note(c, 233.08, 0.14, 0.22, 0.05, 'triangle'); },
    // hit = seconds until the intro's gold flash: a rising breath up to it, then the bloom on it
    intro: function(c, hit){
      if (hit > 0.15) note(c, 260, 0, hit, 0.018, 'sine', 520, hit * 0.8);
      [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){ note(c, f, hit + i * 0.015, 1.6, 0.03); });
    }
  };
  function play(name){
    if (!on || !SOUNDS[name]) return;
    var c = ac(); if (!c) return;
    try { SOUNDS[name](c); } catch (e) {}
  }
  // index.html's intro script calls this. No sound unless the browser already lets the page play it.
  function intro(splash){
    if (!on || reduce || !splash) return;
    try { if (navigator.getAutoplayPolicy && navigator.getAutoplayPolicy('audiocontext') !== 'allowed') return; } catch (e) {}
    var c = ac(); if (!c) return;
    function go(){
      var hit = 0.46;     // the flash's delay in the INTRO styles
      try { var a = splash.querySelector('.is-flash').getAnimations()[0]; if (a && a.currentTime != null) hit = 0.46 - a.currentTime / 1000; } catch (e) {}
      if (hit < -0.3 || !splash.isConnected) return;     // too late to land on the flash
      try { SOUNDS.intro(c, Math.max(0, hit)); } catch (e) {}
    }
    if (c.state === 'running') return go();
    // a blocked context only wakes on the first tap: by then the intro is over, so give it a moment, no more
    var wait = setTimeout(function(){ wait = 0; }, 300);
    c.resume().then(function(){ if (wait && c.state === 'running') { clearTimeout(wait); go(); } }).catch(function(){});
  }
  function sync(){
    var b = document.getElementById('sndBtn'); if (!b) return;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    var s = b.querySelectorAll('span'); if (s.length === 2) { s[0].hidden = !on; s[1].hidden = on; }
  }
  function toggle(){
    on = !on;
    try { localStorage.setItem(KEY, on ? 'on' : 'off'); } catch (e) {}
    sync(); play('tap');
  }
  // The main buttons tap. Send buttons don't: they answer with the chime or the low note.
  document.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('.btn-primary, .nav-cta, .cc-cta')) play('tap');
  }, true);
  document.addEventListener('DOMContentLoaded', sync);
  return { play: play, intro: intro, toggle: toggle };
})();
</script>

// "Sound: on/off" in the footer (SOUND block). Only one of the two shows.
const T_SND = {
  en:{sndOn:'Sound: on', sndOff:'Sound: off'},
  ml:{sndOn:'ശബ്ദം: ഓൺ', sndOff:'ശബ്ദം: ഓഫ്'},
  ta:{sndOn:'ஒலி: ஆன்', sndOff:'ஒலி: ஆஃப்'},
  te:{sndOn:'శబ్దం: ఆన్', sndOff:'శబ్దం: ఆఫ్'},
  kn:{sndOn:'ಧ್ವನಿ: ಆನ್', sndOff:'ಧ್ವನಿ: ಆಫ್'},
  hi:{sndOn:'आवाज़: चालू', sndOff:'आवाज़: बंद'}
};
Object.keys(T_SND).forEach(l => { T[l] = Object.assign(T[l] || {}, T_SND[l]); });
let CUR = 'en', RATING = 0;

function setLang(code){
  if (!T[code]) code = 'en';
  CUR = code;
  const d = T[code];
  document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (d[k]) el.textContent = d[k]; });
  document.querySelectorAll('[data-ph]').forEach(el => { const k = el.getAttribute('data-ph'); if (d[k]) el.placeholder = d[k]; });
  document.querySelectorAll('#langBar .lang-pill').forEach(b => b.classList.toggle('active', b.dataset.lang === code));
  document.documentElement.lang = code;
  const pl = document.getElementById('fbPageLang'); if (pl) pl.value = code;
  document.querySelectorAll('a[data-keep-lang]').forEach(a => {
    const [path, hash] = a.getAttribute('href').replace(/\?lang=[a-z]+/, '').split('#');
    a.setAttribute('href', path + (code !== 'en' ? '?lang=' + code : '') + (hash ? '#' + hash : ''));
  });
}

// Five star buttons; picking one fills it and every star before it.
(function(){
  const box = document.getElementById('fbStars');
  const path = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.3 9.6l6-.9z"/></svg>';
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'star'; b.dataset.v = i;
    b.setAttribute('aria-label', i + ' / 5'); b.setAttribute('aria-pressed', 'false');
    b.innerHTML = path;
    b.addEventListener('click', () => {
      RATING = i;
      document.getElementById('fbRating').value = i;
      box.classList.remove('need');
      box.querySelectorAll('.star').forEach(s => { const on = +s.dataset.v <= i; s.classList.toggle('on', on); s.setAttribute('aria-pressed', String(+s.dataset.v === i)); });
      document.getElementById('fbMsg').textContent = '';
    });
    box.appendChild(b);
  }
})();

document.getElementById('fbForm').addEventListener('submit', function(e){
  e.preventDefault();
  const d = T[CUR] || T.en, msg = document.getElementById('fbMsg'), btn = document.getElementById('fbSend');
  if (!RATING && window.SND) SND.play('err');
  if (!RATING) { msg.textContent = d.fbNeedStars; document.getElementById('fbStars').classList.add('need'); return; }
  btn.disabled = true; msg.textContent = '';
  const f = this;
  const done = ok => {
    if (!ok) { msg.textContent = d.fbErr; btn.disabled = false; if (window.SND) SND.play('err'); return; }
    const wrap = document.getElementById('fbWrap');
    wrap.innerHTML = '<div class="sent-ok"><svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l8 8 15-16"/></svg><h2></h2><p></p></div>';
    wrap.querySelector('h2').textContent = d.okTitle;
    wrap.querySelector('p').textContent = d.okBody;
    if (window.SND) SND.play('ok');
  };
  // A bot filled the hidden field: pretend it worked, send nothing.
  if (f.elements['bot-field'].value) { done(true); return; }
  sheetSend({
    type: 'feedback',
    rating: String(RATING),
    got: f.elements.got.value,
    name: f.elements.name.value.trim(),
    mobile: f.elements.mobile.value.trim(),
    comment: f.elements.comment.value.trim(),
    show_ok: f.elements.show_ok.checked ? 'yes' : 'no',
    page_language: CUR
  }, done);
});

/* Sends the feedback to the Google Sheet, the same way the lead form does:
   a real form post into a hidden iframe (Apps Script can silently drop a
   fetch). done(true) once Google answers, done(false) if the link is not set
   or nothing comes back in 20 seconds. Same function as on index.html. */
function sheetSend(data, done){
  if (!CONTACT.sheetUrl) { done(false); return; }
  const id = 'sink' + Date.now();
  const frame = document.createElement('iframe');
  frame.name = frame.id = id; frame.style.display = 'none';
  document.body.appendChild(frame);
  let finished = false;
  const finish = ok => { if (finished) return; finished = true; done(ok); setTimeout(() => frame.remove(), 1000); };
  frame.onload = () => finish(true);     // set after appending, so the blank page does not count
  setTimeout(() => finish(false), 20000);
  const form = document.createElement('form');
  form.method = 'POST'; form.action = CONTACT.sheetUrl; form.target = id; form.style.display = 'none';
  const field = document.createElement('input');
  field.type = 'hidden'; field.name = 'payload';
  field.value = JSON.stringify(Object.assign({secret: CONTACT.sheetKey, source: 'feedback page'}, data));
  form.appendChild(field);
  document.body.appendChild(form);
  form.submit();
  setTimeout(() => form.remove(), 2000);
}

// The CRM's link can carry the language and who it is for:
// feedback.html?lang=ml&n=<name>&m=<mobile>&got=<Credit card|Loan>
(function(){
  const q = new URLSearchParams(location.search);
  setLang(q.get('lang') || 'en');
  const n = (q.get('n') || '').slice(0, 60), m = (q.get('m') || '').replace(/\D/g, '').slice(-10), got = q.get('got') || '';
  if (n) document.getElementById('fbName').value = n;
  if (m) document.getElementById('fbMobile').value = m;
  const sel = document.getElementById('fbGot');
  if (got && [...sel.options].some(o => o.value === got)) sel.value = got;
})();
