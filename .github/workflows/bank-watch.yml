# BANK WATCH: every morning, read the bank pages the site links to and open an
# issue (GitHub emails it) when fees, rates, offers or the list of cards change.
# It never changes the site. The script is tools/bank-watch.js.
name: Bank watch

on:
  schedule:
    - cron: '30 3 * * *'     # 9:00 am India time
  workflow_dispatch:          # the "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ['tools/bank-watch.js', '.github/workflows/bank-watch.yml']

permissions:
  contents: read
  issues: write

concurrency: bank-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # what the pages said last time (kept between runs, never in the repo)
      - uses: actions/cache/restore@v4
        with:
          path: .bank-watch
          key: bank-watch-${{ github.run_id }}
          restore-keys: bank-watch-

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read the bank pages
        run: node --max-http-header-size=81920 tools/bank-watch.js .bank-watch/state.json .bank-watch-out

      - uses: actions/cache/save@v4
        with:
          path: .bank-watch
          key: bank-watch-${{ github.run_id }}

      - name: Open an issue if something changed
        if: hashFiles('.bank-watch-out/report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "$(cat .bank-watch-out/title.txt)" --body-file .bank-watch-out/report.md
